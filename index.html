<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca Natural para Gatos</title>
<meta name="description" content="Recetas naturales, sobrecitos, premios y cuidados para tu gato. Todo en línea, sin descargar nada.">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --bg2:#0d1324; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --txt:#eef2ff; --muted:#9aa6c4; --acc:#2ee6a6; --acc2:#7aa2ff; --hot:#ff9f43;
  --r:20px; --sh:0 20px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 Inter,system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:flota 18s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:420px;height:420px;background:#2ee6a6;left:-120px;top:-80px}
.orbs i:nth-child(2){width:380px;height:380px;background:#7a5cff;right:-140px;top:30vh;animation-delay:-6s}
.orbs i:nth-child(3){width:340px;height:340px;background:#ff7a59;left:20vw;bottom:-160px;animation-delay:-11s;opacity:.22}
@keyframes flota{to{transform:translate(60px,40px) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at top,#000 30%,transparent 75%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;z-index:1}

/* barra superior */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(7,11,22,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:700 17px/1 "Space Grotesk";letter-spacing:-.01em;min-width:0}
.logo b{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#2ee6a6,#7aa2ff);font-size:19px;flex:none;box-shadow:0 0 24px rgba(46,230,166,.45)}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.ib{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);flex:none;transition:.2s}
.ib:hover{background:var(--card2)}
.ib svg{width:20px;height:20px}

main{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;letter-spacing:-.02em;line-height:1.15;margin:0}

/* inicio */
.hero{padding:26px 0 8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(46,230,166,.12);border:1px solid rgba(46,230,166,.35);color:#9ff5d6;font-size:13.5px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:#2ee6a6;box-shadow:0 0 10px #2ee6a6;animation:pulso 1.6s infinite}
@keyframes pulso{50%{opacity:.35}}
.hero h1{font-size:clamp(32px,7vw,56px);margin:16px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#2ee6a6,#7aa2ff 55%,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:640px;margin:0 0 18px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.stat{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.stat b{display:block;font:700 26px/1.1 "Space Grotesk";background:linear-gradient(90deg,#fff,#9fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12.5px;color:var(--muted)}
.seguir{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:12px;border-radius:18px;background:linear-gradient(135deg,rgba(122,162,255,.18),rgba(46,230,166,.12));border:1px solid rgba(122,162,255,.35)}
.seguir img{width:54px;height:54px;object-fit:cover;border-radius:12px;flex:none}
.seguir div{flex:1;min-width:0}
.seguir small{color:var(--muted);display:block;font-size:12.5px}
.seguir strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-t{display:flex;align-items:end;justify-content:space-between;margin:34px 0 14px}
.sec-t h2{font-size:22px}
.sec-t span{color:var(--muted);font-size:13px}
.libros{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.libro{position:relative;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);transition:.25s;isolation:isolate}
.libro:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 18px 50px -12px color-mix(in srgb,var(--c) 55%,transparent)}
.libro .cv{position:relative;aspect-ratio:4/3;overflow:hidden;background:#111}
.libro .cv img{width:100%;height:100%;object-fit:cover;object-position:top;transition:.5s}
.libro:hover .cv img{transform:scale(1.05)}
.libro .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(7,11,22,.95))}
.libro .em{position:absolute;left:12px;bottom:10px;z-index:2;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-size:22px;background:rgba(7,11,22,.6);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 50%,transparent)}
.libro .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.libro h3{font-size:18px}
.libro p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.bar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.fav-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.fav-list a{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);max-width:280px}
.fav-list img{width:40px;height:40px;border-radius:9px;object-fit:cover}
.fav-list span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nota{margin:34px 0 0;padding:16px;border-radius:16px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:14px}

/* libro */
.lhead{position:relative;display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:18px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);overflow:hidden}
.lhead img{width:120px;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:14px;box-shadow:var(--sh)}
.lhead h1{font-size:clamp(24px,5vw,36px);margin:8px 0}
.lhead p{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:600;background:var(--c,var(--acc));color:#06101c;box-shadow:0 8px 26px -6px var(--c,var(--acc));transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.grupo{margin-top:26px}
.grupo h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--c);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.grupo h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 50%,transparent),transparent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:.2s;min-width:0}
.item:hover{background:var(--card2);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.item .th{width:56px;height:56px;border-radius:12px;flex:none;object-fit:cover;background:#1a2133}
.item .th.ph{display:grid;place-items:center;font-size:24px}
.item div{min-width:0;flex:1}
.item b{display:block;font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item small{color:var(--muted);font-size:12px}
.item .ok{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--c) 25%,transparent);color:var(--c)}

/* lector */
.rhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.rhead a{color:var(--c)}
.leer{max-width:760px;margin:0 auto}
.leer h1{font-size:clamp(26px,6vw,38px);margin:6px 0 18px}
.cont{padding:22px;border-radius:24px;background:rgba(13,19,36,.72);border:1px solid var(--line);backdrop-filter:blur(10px)}
.cont h2{font-size:24px;margin:22px 0 10px;color:#fff}
.cont h3{font-size:17px;margin:20px 0 8px;color:var(--c);display:flex;align-items:center;gap:8px}
.cont h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c);transform:rotate(45deg);flex:none}
.cont p{margin:0 0 12px;color:#d6dcf0}
.cont ul{margin:0 0 14px;padding:0;list-style:none}
.cont li{position:relative;padding:9px 12px 9px 40px;margin:6px 0;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.cont li::before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:50%;border:2px solid var(--c)}
.cont li.chk{cursor:pointer}
.cont li.chk.on{opacity:.55;text-decoration:line-through}
.cont li.chk.on::before{background:var(--c)}
.cont li .n{position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--c);color:#06101c}
.cont li.num::before{display:none}
.cont figure{margin:16px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.cont figure img{display:block;width:100%;height:auto}
.lam{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);cursor:zoom-in;background:#fff}
.lam img{display:block;width:100%;height:auto}
.hint{display:flex;align-items:center;gap:8px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
details.tx{margin-top:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
details.tx summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:14px}
details.tx div{padding:0 16px 14px;color:#cdd5ee;font-size:14.5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;align-items:center;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(7,11,22,.86);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav .pr{position:absolute;left:0;top:-1px;height:2px;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .3s}
.nav .btn{flex:1;padding:12px 10px;min-width:0}
.nav .btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ib{width:48px;height:48px}
.ib.on{background:color-mix(in srgb,#ff6b9a 25%,transparent);border-color:#ff6b9a;color:#ff6b9a}

/* panel lateral / buscador */
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;right:0;z-index:41;width:min(400px,92vw);background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:.3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.dr.on{transform:none}
.dr header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr header b{flex:1;font-family:"Space Grotesk";font-size:17px}
.dr .lst{overflow:auto;padding:8px 10px 30px}
.dr .lst h4{margin:16px 8px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.dr .lst a{display:block;padding:9px 12px;border-radius:10px;font-size:14.5px;color:#cfd6ee}
.dr .lst a:hover{background:var(--card)}
.dr .lst a.cur{background:color-mix(in srgb,var(--c) 18%,transparent);color:#fff;font-weight:600}
.busca{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));z-index:41;width:min(640px,calc(100vw - 32px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;transition:.25s;background:var(--bg2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.busca.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.busca label{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.busca input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:17px;min-width:0}
.busca .res{max-height:min(60vh,520px);overflow:auto;padding:8px}
.busca .res a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px}
.busca .res a:hover,.busca .res a.sel{background:var(--card2)}
.busca .res img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
.busca .res b{display:block;font-size:14.5px;line-height:1.3}
.busca .res small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busca .vacio{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chips button{padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
mark{background:rgba(46,230,166,.28);color:#fff;border-radius:4px;padding:0 2px}

/* zoom */
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
.zoom.on{display:block}
.zoom img{display:block;width:min(1000px,100%);margin:0 auto;padding:60px 0 30px}
.zoom .ib{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px}

/* calculadora */
.calc{padding:22px;border-radius:24px;background:linear-gradient(160deg,rgba(77,212,255,.16),rgba(122,92,255,.10));border:1px solid rgba(77,212,255,.35);margin-bottom:18px}
.calc h2{font-size:22px;margin-bottom:4px}
.calc .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.fld{margin:14px 0}
.fld label{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px;margin-bottom:8px}
.fld label output{font:700 18px "Space Grotesk";color:#4dd4ff}
input[type=range]{width:100%;accent-color:#4dd4ff;height:28px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{padding:11px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;text-align:left;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:12px}
.seg button.on{background:rgba(77,212,255,.18);border-color:#4dd4ff}
.res3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.res3 div{padding:14px 8px;border-radius:16px;text-align:center;background:rgba(7,11,22,.55);border:1px solid var(--line)}
.res3 b{display:block;font:700 26px/1.1 "Space Grotesk";color:#fff}
.res3 span{font-size:12px;color:var(--muted)}
.res3 div:nth-child(2){border-color:#4dd4ff;box-shadow:0 0 30px -8px #4dd4ff}
.aviso{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.fade{animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
@media (max-width:560px){
  main{padding:14px 16px 120px}
  .lhead{grid-template-columns:84px 1fr;padding:14px;gap:14px}
  .lhead img{width:84px}
  .lhead p{display:none}
  .cont{padding:16px;border-radius:20px}
  .stats b{font-size:22px}
  .seg{grid-template-columns:1fr}
  .libros{grid-template-columns:1fr 1fr;gap:12px}
  .libro .bd{padding:10px 12px 12px}
  .libro h3{font-size:15px}
  .libro p{display:none}
  .libro .em{width:34px;height:34px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="grid-bg"></div>
<div id="app">
  <header class="top">
    <a class="logo" href="#/"><b>🐾</b><span>Biblioteca Natural para Gatos</span></a>
    <div class="sp"></div>
    <button class="ib" id="bBuscar" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ib" id="bMenu" aria-label="Menú" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </header>
  <main id="vista"></main>
</div>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"><header><b id="drT">Contenido</b><button class="ib" id="drX" aria-label="Cerrar">✕</button></header><div class="lst" id="drL"></div></aside>
<div class="busca" id="busca">
  <label><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Busca una receta o ingrediente…" autocomplete="off"><button class="ib" id="qX" aria-label="Cerrar" style="width:34px;height:34px">✕</button></label>
  <div class="res" id="qR"></div>
</div>
<div class="zoom" id="zoom"><button class="ib" id="zX" aria-label="Cerrar">✕</button><img id="zI" alt=""></div>
<script src="data.js"></script>
<script>
const L = window.LIBROS, $ = s => document.querySelector(s);
const RECETAS = {guia:50, sobres:50, premios:19, renales:3};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st = {
  get(k, d){ try { const v = localStorage.getItem("bng_"+k); return v ? JSON.parse(v) : d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem("bng_"+k, JSON.stringify(v)) } catch(e){} }
};
let vistos = st.get("vistos", {}), favs = st.get("favs", []), ultimo = st.get("ultimo", null);
const libro = id => L.find(b => b.id === id);
const miniatura = s => s.capa ? s.img : (((s.conteudo || []).find(c => c.t === "img") || {}).src || s.thumb);
const textoDe = s => s.capa ? (s.texto || []).join(" ") : (s.conteudo || []).filter(c => c.x).map(c => c.x).join(" ");
const prog = b => b.secoes.filter((_, i) => vistos[b.id + "/" + i]).length / b.secoes.length;

function setCor(c){ document.documentElement.style.setProperty("--c", c || "#2ee6a6") }

/* ---------- INICIO ---------- */
function inicio(){
  setCor("#2ee6a6"); $("#bMenu").hidden = true;
  const tot = Object.values(RECETAS).reduce((a, b) => a + b, 0);
  const u = ultimo && libro(ultimo.l) && libro(ultimo.l).secoes[ultimo.s] ? ultimo : null;
  const f = favs.map(k => { const [l, s] = k.split("/"); const b = libro(l); return b && b.secoes[s] ? {k, b, s: b.secoes[s]} : null }).filter(Boolean);
  $("#vista").innerHTML = `
  <section class="hero fade">
    <span class="pill"><i></i> 100% en línea · No ocupa espacio en tu celular</span>
    <h1>Todo para alimentar y cuidar <em>a tu gato</em>, en un solo lugar</h1>
    <p>Recetas naturales, sobrecitos, premios y guías de salud. Ábrelo cuando quieras desde el navegador: no tienes que descargar nada.</p>
    <div class="stats">
      <div class="stat"><b>${L.length}</b><span>materiales</span></div>
      <div class="stat"><b>${tot}+</b><span>recetas</span></div>
      <div class="stat"><b>0 MB</b><span>en tu celular</span></div>
    </div>
    ${u ? `<a class="seguir" href="#/${u.l}/${u.s}"><img src="${miniatura(libro(u.l).secoes[u.s]) || libro(u.l).capa}" alt=""><div><small>Continúa donde te quedaste</small><strong>${esc(libro(u.l).secoes[u.s].titulo)}</strong></div><span class="btn" style="--c:#7aa2ff;padding:10px 14px">Seguir →</span></a>` : ""}
  </section>
  ${f.length ? `<div class="sec-t"><h2>❤️ Mis favoritas</h2><span>${f.length}</span></div><div class="fav-list">${f.map(x => `<a href="#/${x.k}"><img src="${miniatura(x.s) || x.b.capa}" alt=""><span>${esc(x.s.titulo)}</span></a>`).join("")}</div>` : ""}
  <div class="sec-t"><h2>Tus materiales</h2><span>Toca para abrir</span></div>
  <div class="libros">${L.map((b, i) => `
    <a class="libro fade" href="#/${b.id}" style="--c:${b.cor};animation-delay:${i * 50}ms">
      <div class="cv"><img src="${b.capa}" alt="${esc(b.titulo)}" loading="lazy"><span class="em">${b.emoji}</span></div>
      <div class="bd"><h3>${esc(b.titulo)}</h3><p>${esc(b.desc)}</p>
      <div class="meta">${RECETAS[b.id] ? `<span class="tag">${RECETAS[b.id]} recetas</span>` : `<span class="tag">${b.id === "calc" ? "Herramienta" : "Guía"}</span>`}<div class="bar"><i style="width:${Math.round(prog(b) * 100)}%"></i></div></div></div>
    </a>`).join("")}</div>
  <div class="nota">💡 <b>Consejo:</b> guarda esta página en tu pantalla de inicio (menú del navegador → “Agregar a pantalla de inicio”) para abrirla como una app.</div>`;
}

/* ---------- LIBRO ---------- */
function verLibro(b){
  setCor(b.cor); $("#bMenu").hidden = false;
  let primero = b.secoes.findIndex((_, i) => !vistos[b.id + "/" + i]); if (primero < 0) primero = 0;
  $("#vista").innerHTML = `
  <div class="lhead fade"><img src="${b.capa}" alt=""><div><span class="tag">${b.emoji} ${RECETAS[b.id] ? RECETAS[b.id] + " recetas" : b.secoes.length + " secciones"}</span><h1>${esc(b.titulo)}</h1><p>${esc(b.desc)}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/${b.id}/${primero}">${primero ? "Continuar" : "Empezar"} →</a>${b.id === "calc" ? `<a class="btn ghost" href="#/calc/herramienta">🧮 Calcular ahora</a>` : ""}</div></div></div>
  ${b.id === "calc" ? calculadoraHTML() : ""}
  ${b.grupos.map(g => `<div class="grupo fade"><h3>${esc(g.nome)}</h3><div class="items">${g.secoes.map(i => { const s = b.secoes[i], m = miniatura(s);
    return `<a class="item" href="#/${b.id}/${i}">${m ? `<img class="th" src="${m}" alt="" loading="lazy">` : `<span class="th ph">${b.emoji}</span>`}<div><b>${esc(s.titulo)}</b><small>${s.capa ? "Lámina ilustrada" : "Lectura"}</small></div>${vistos[b.id + "/" + i] ? `<span class="ok">✓</span>` : ""}</a>` }).join("")}</div></div>`).join("")}`;
  if (b.id === "calc") ligarCalc();
}

/* ---------- LECTOR ---------- */
function bloque(c, b, k){
  if (c.t === "img") return `<figure><img src="${c.src}" width="${c.w}" height="${c.h}" alt="" loading="lazy"></figure>`;
  if (c.t === "h2") return `<h2>${esc(c.x)}</h2>`;
  if (c.t === "h3") return `<h3>${esc(c.x)}</h3>`;
  if (c.t === "li") {
    const m = c.x.match(/^(\d{1,2})[.)]\s+(.*)$/);
    if (m) return `<li class="num"><span class="n">${m[1]}</span>${esc(m[2])}</li>`;
    return `<li class="chk" data-k="${k}">${esc(c.x)}</li>`;
  }
  return `<p>${esc(c.x)}</p>`;
}
function verSeccion(b, i){
  const s = b.secoes[i]; if (!s) return verLibro(b);
  setCor(b.cor); $("#bMenu").hidden = false;
  vistos[b.id + "/" + i] = 1; st.set("vistos", vistos);
  ultimo = {l: b.id, s: i}; st.set("ultimo", ultimo);
  const g = b.grupos.find(g => g.secoes.includes(i));
  const marc = st.get("chk", {});
  let html = "";
  if (s.capa) {
    html = `<div class="lam" data-z="${s.img}"><img src="${s.img}" width="${s.w}" height="${s.h}" alt="${esc(s.titulo)}"></div>
      <div class="hint">🔍 Toca la imagen para verla en grande</div>
      ${s.texto && s.texto.length ? `<details class="tx"><summary>📝 Ver solo el texto</summary><div>${s.texto.map(esc).join("<br>")}</div></details>` : ""}`;
  } else {
    let out = [], ul = null;
    const igual = (a, b) => norm(a).replace(/\W/g, "") === norm(b).replace(/\W/g, "");
    s.conteudo.forEach((c, j) => {
      if (j < 3 && c.x && (c.t === "h2" || c.t === "h3") && (igual(c.x, s.titulo) || norm(s.titulo).endsWith(norm(c.x)) && c.x.length > 12)) return;
      const h = bloque(c, b, b.id + "/" + i + "/" + j);
      if (c.t === "li") { if (!ul) { ul = []; out.push(ul) } ul.push(h) } else { ul = null; out.push(h) }
    });
    html = `<div class="cont">${out.map(x => Array.isArray(x) ? `<ul>${x.join("")}</ul>` : x).join("")}</div>`;
  }
  const fav = favs.includes(b.id + "/" + i);
  $("#vista").innerHTML = `<article class="leer fade">
    <div class="rhead"><a href="#/${b.id}">${b.emoji} ${esc(b.titulo)}</a>${g ? `<span>›</span><span>${esc(g.nome)}</span>` : ""}<span style="margin-left:auto">${i + 1} / ${b.secoes.length}</span></div>
    <h1>${esc(s.titulo)}</h1>${html}</article>
  <nav class="nav"><span class="pr" style="width:${(i + 1) / b.secoes.length * 100}%"></span>
    <a class="btn ghost" href="#/${b.id}/${Math.max(0, i - 1)}" ${i ? "" : 'style="visibility:hidden"'}>← <span>Anterior</span></a>
    <button class="ib ${fav ? "on" : ""}" id="bFav" aria-label="Favorita">${fav ? "♥" : "♡"}</button>
    ${i < b.secoes.length - 1 ? `<a class="btn" href="#/${b.id}/${i + 1}"><span>Siguiente</span> →</a>` : `<a class="btn" href="#/">Terminar ✓</a>`}
  </nav>`;
  document.querySelectorAll("li.chk").forEach(li => { if (marc[li.dataset.k]) li.classList.add("on");
    li.onclick = () => { li.classList.toggle("on"); const m = st.get("chk", {}); li.classList.contains("on") ? m[li.dataset.k] = 1 : delete m[li.dataset.k]; st.set("chk", m) } });
  const lam = document.querySelector(".lam"); if (lam) lam.onclick = () => abrirZoom(lam.dataset.z);
  document.querySelectorAll(".cont figure img").forEach(im => im.onclick = () => abrirZoom(im.src));
  $("#bFav").onclick = () => { const k = b.id + "/" + i; favs = favs.includes(k) ? favs.filter(x => x !== k) : [...favs, k]; st.set("favs", favs);
    const on = favs.includes(k); $("#bFav").classList.toggle("on", on); $("#bFav").textContent = on ? "♥" : "♡" };
  window.scrollTo({top: 0});
}

/* ---------- CALCULADORA ---------- */
function calculadoraHTML(){
  return `<div class="calc fade" id="herr">
    <h2>🧮 Calculadora de porciones</h2><p class="sub">Mueve los controles y mira al instante cuánto debe comer tu gato.</p>
    <div class="fld"><label>Peso de tu gato <output id="cPo">4 kg</output></label><input type="range" id="cP" min="1" max="10" step="0.5" value="4"></div>
    <div class="fld"><label>Perfil</label><div class="seg" id="cF">
      <button data-f="1.2" class="on">Adulto esterilizado<small>factor 1,2</small></button>
      <button data-f="1.4">Adulto no esterilizado<small>factor 1,4</small></button>
      <button data-f="1.0">Poco activo / tiende a engordar<small>factor 1,0</small></button>
      <button data-f="2.5">Gatito en crecimiento<small>factor 2,5</small></button></div></div>
    <div class="fld"><label>Calorías de la receta <output id="cKo">150 kcal / 100 g</output></label><input type="range" id="cK" min="80" max="250" step="5" value="150"></div>
    <div class="fld"><label>Comidas al día <output id="cMo">2</output></label><input type="range" id="cM" min="1" max="4" step="1" value="2"></div>
    <div class="res3"><div><b id="rK">—</b><span>kcal / día</span></div><div><b id="rG">—</b><span>gramos / día</span></div><div><b id="rC">—</b><span>g por comida</span></div></div>
    <p class="aviso">Estimación inicial (RER = 70 × peso<sup>0,75</sup> × factor). Gatos con enfermedades, gestantes o lactantes: confirma siempre con tu veterinario.</p>
  </div>`;
}
function ligarCalc(){
  let f = 1.2;
  const calc = () => {
    const p = +$("#cP").value, k = +$("#cK").value, m = +$("#cM").value;
    const kcal = 70 * Math.pow(p, .75) * f, g = kcal / (k / 100);
    $("#cPo").textContent = String(p).replace(".", ",") + " kg"; $("#cKo").textContent = k + " kcal / 100 g"; $("#cMo").textContent = m;
    $("#rK").textContent = Math.round(kcal); $("#rG").textContent = Math.round(g); $("#rC").textContent = Math.round(g / m);
  };
  ["#cP", "#cK", "#cM"].forEach(s => $(s).oninput = calc);
  document.querySelectorAll("#cF button").forEach(bt => bt.onclick = () => { document.querySelectorAll("#cF button").forEach(x => x.classList.remove("on")); bt.classList.add("on"); f = +bt.dataset.f; calc() });
  calc();
}

/* ---------- MENÚ LATERAL ---------- */
function abrirMenu(){
  const [, l, s] = location.hash.split("/"); const b = libro(l); if (!b) return;
  $("#drT").textContent = b.titulo;
  $("#drL").innerHTML = `<a href="#/">🏠 Inicio · todos los materiales</a>` + b.grupos.map(g => `<h4>${esc(g.nome)}</h4>` + g.secoes.map(i => `<a href="#/${b.id}/${i}" class="${String(i) === s ? "cur" : ""}">${vistos[b.id + "/" + i] ? "✓ " : ""}${esc(b.secoes[i].titulo)}</a>`).join("")).join("");
  $("#dr").classList.add("on"); $("#ov").classList.add("on");
  const c = $("#drL .cur"); if (c) c.scrollIntoView({block: "center"});
}
function cerrar(){ ["#dr", "#ov", "#busca"].forEach(s => $(s).classList.remove("on")) }

/* ---------- BUSCADOR ---------- */
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const IDX = [];
L.forEach(b => b.secoes.forEach((s, i) => IDX.push({b, i, s, t: norm(s.titulo), x: norm(textoDe(s)), raw: textoDe(s)})));
function abrirBusca(){ $("#busca").classList.add("on"); $("#ov").classList.add("on"); $("#q").value = ""; buscar(); setTimeout(() => $("#q").focus(), 50) }
function buscar(){
  const q = norm($("#q").value.trim());
  if (!q) { $("#qR").innerHTML = `<div class="chips">${["pollo", "pescado", "calabaza", "sardina", "premios", "renal", "sarro", "estrés", "porción", "conservar"].map(w => `<button>${w}</button>`).join("")}</div>`;
    document.querySelectorAll(".chips button").forEach(bt => bt.onclick = () => { $("#q").value = bt.textContent; buscar() }); return }
  const ws = q.split(/\s+/);
  const r = IDX.map(e => { let p = 0; for (const w of ws) { if (e.t.includes(w)) p += 3; else if (e.x.includes(w)) p += 1; else return null } return {e, p} })
    .filter(Boolean).sort((a, b) => b.p - a.p).slice(0, 40);
  if (!r.length) { $("#qR").innerHTML = `<div class="vacio">No encontramos “${esc($("#q").value)}”. Prueba con otro ingrediente 🐾</div>`; return }
  $("#qR").innerHTML = r.map(({e}) => { const pos = norm(e.raw).indexOf(ws[0]); const sn = pos >= 0 ? e.raw.slice(Math.max(0, pos - 30), pos + 70) : "";
    return `<a href="#/${e.b.id}/${e.i}"><img src="${miniatura(e.s) || e.b.capa}" alt="" loading="lazy"><div style="min-width:0"><b>${esc(e.s.titulo)}</b><small>${e.b.emoji} ${esc(e.b.titulo)}${sn ? " · …" + esc(sn) + "…" : ""}</small></div></a>` }).join("");
}

/* ---------- ZOOM ---------- */
function abrirZoom(src){ $("#zI").src = src; $("#zoom").classList.add("on"); document.body.style.overflow = "hidden" }
function cerrarZoom(){ $("#zoom").classList.remove("on"); document.body.style.overflow = "" }

/* ---------- RUTAS ---------- */
function ruta(){
  cerrar(); cerrarZoom();
  const [, l, s] = location.hash.split("/"); const b = libro(l);
  if (!b) inicio();
  else if (s === "herramienta") { verLibro(b); setTimeout(() => { const h = $("#herr"); if (h) h.scrollIntoView({behavior: "smooth"}) }, 60) }
  else if (s === undefined || s === "") { verLibro(b); window.scrollTo({top: 0}) }
  else verSeccion(b, +s);
}
window.addEventListener("hashchange", ruta);
$("#bBuscar").onclick = abrirBusca; $("#bMenu").onclick = abrirMenu;
$("#ov").onclick = cerrar; $("#drX").onclick = cerrar; $("#qX").onclick = cerrar;
$("#q").oninput = buscar; $("#zX").onclick = cerrarZoom; $("#zoom").onclick = e => { if (e.target.id === "zoom") cerrarZoom() };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { cerrar(); cerrarZoom() }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); abrirBusca() }
  const [, l, s] = location.hash.split("/"); const b = libro(l);
  if (b && s !== undefined && s !== "" && !$("#busca").classList.contains("on")) {
    if (e.key === "ArrowRight" && +s < b.secoes.length - 1) location.hash = `#/${l}/${+s + 1}`;
    if (e.key === "ArrowLeft" && +s > 0) location.hash = `#/${l}/${+s - 1}`;
  }
});
ruta();
</script>
</body>
</html>
