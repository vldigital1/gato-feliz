<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Gatito Feliz</title>
<meta name="description" content="Tu área de miembros: clases en video, recetas naturales y herramientas inteligentes para tu gato.">
<meta name="theme-color" content="#04050d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --bg2:#0a0d1c; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --line:rgba(160,180,255,.14); --txt:#eef1ff; --muted:#8f9bc2;
  --cy:#3ef2ff; --vi:#8b5cff; --pk:#ff4fd8; --gr:#3dffb0; --am:#ffc857;
  --grad:linear-gradient(120deg,#3ef2ff,#8b5cff 50%,#ff4fd8);
  --r:22px; --sh:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15.5px/1.6 Inter,system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif;letter-spacing:-.02em;line-height:1.12;margin:0}
.mono{font-family:"JetBrains Mono",monospace;letter-spacing:.04em}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- fondo ---------- */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(80px);opacity:.55;
  background:radial-gradient(40% 35% at 15% 10%,rgba(62,242,255,.35),transparent 70%),radial-gradient(35% 30% at 85% 25%,rgba(139,92,255,.45),transparent 70%),radial-gradient(40% 35% at 50% 95%,rgba(255,79,216,.22),transparent 70%);
  animation:aur 22s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) rotate(8deg) scale(1.08)}}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(120,150,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.06) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 35%,transparent 80%)}
.scan{position:fixed;left:0;right:0;height:120px;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(62,242,255,.05),transparent);animation:scan 9s linear infinite}
@keyframes scan{from{top:-120px}to{top:100vh}}
#app{position:relative;z-index:1}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(4,5,13,.66);backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mini-orb{width:34px;height:34px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 35% 30%,#fff,#7ff6ff 18%,#8b5cff 55%,#24104d 100%);box-shadow:0 0 22px rgba(62,242,255,.55),0 0 40px rgba(139,92,255,.35);animation:respira 3.2s ease-in-out infinite}
.mini-orb::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--cy);border-right-color:var(--pk);animation:gira 2.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes respira{50%{transform:scale(.92);filter:brightness(1.25)}}
.brand b{display:block;font:700 16px/1.1 "Space Grotesk";white-space:nowrap}
.brand small{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--gr)}
.brand small i{width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);animation:pul 1.4s infinite}
@keyframes pul{50%{opacity:.3}}
.top .sp{flex:1}
.chip-acc{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid rgba(255,200,87,.45);background:rgba(255,200,87,.1);color:var(--am);white-space:nowrap}
.chip-acc.ok{border-color:rgba(61,255,176,.45);background:rgba(61,255,176,.1);color:var(--gr)}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--glass);border:1px solid var(--line);flex:none}
.ib svg{width:19px;height:19px}

main{max-width:1120px;margin:0 auto;padding:18px 16px 130px}

/* ---------- hero IA ---------- */
.hero{position:relative;padding:18px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,rgba(62,242,255,.08),rgba(139,92,255,.07) 45%,rgba(255,79,216,.05));box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.hgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
.ai-row{display:flex;align-items:center;gap:14px}
.orb{position:relative;width:78px;height:78px;flex:none}
.orb .core{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9ffaff 15%,#3ef2ff 32%,#8b5cff 62%,#1a0b3d);box-shadow:0 0 30px #3ef2ff,0 0 60px rgba(139,92,255,.7);animation:respira 3s ease-in-out infinite}
.orb .r1,.orb .r2,.orb .r3{position:absolute;border-radius:50%;border:1.5px solid transparent}
.orb .r1{inset:4px;border-top-color:var(--cy);border-bottom-color:var(--cy);animation:gira 3s linear infinite}
.orb .r2{inset:-2px;border-left-color:var(--pk);border-right-color:var(--vi);animation:gira 5s linear infinite reverse}
.orb .r3{inset:-9px;border:1px dashed rgba(62,242,255,.35);animation:gira 18s linear infinite}
.ai-tag{font-size:11px;color:var(--cy)}
.typing{font:600 17px/1.4 "Space Grotesk";min-height:48px}
.typing .cur{display:inline-block;width:8px;height:18px;margin-left:2px;background:var(--cy);vertical-align:-3px;animation:pul .8s steps(1) infinite}
.hero h1{font-size:clamp(28px,7vw,46px);margin:14px 0 8px}
.hero p.lead{color:var(--muted);margin:0 0 14px}
.feat{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/9;background:#000;cursor:pointer;border:1px solid var(--line)}
.feat img{width:100%;height:100%;object-fit:cover;opacity:.85;transition:.4s}
.feat:hover img{transform:scale(1.04);opacity:1}
.feat .play{position:absolute;inset:0;display:grid;place-items:center}
.playbtn{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:rgba(4,5,13,.55);backdrop-filter:blur(8px);border:1.5px solid rgba(62,242,255,.7);box-shadow:0 0 30px rgba(62,242,255,.5)}
.playbtn svg{width:26px;height:26px;margin-left:4px;fill:#fff}
.feat .lbl{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:end;gap:8px}
.feat .lbl b{font:700 15px/1.25 "Space Grotesk";text-shadow:0 2px 12px #000}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(4,5,13,.6);border:1px solid var(--line);backdrop-filter:blur(6px);white-space:nowrap}
.badge.free{color:var(--gr);border-color:rgba(61,255,176,.4)}
.badge.lock{color:var(--am);border-color:rgba(255,200,87,.45)}

/* panel de acceso */
.acc{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:20px;background:rgba(4,5,13,.5);border:1px solid var(--line)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cy) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#070917}
.ring b{position:relative;font:700 15px "Space Grotesk"}
.acc h3{font-size:16px;margin-bottom:2px}
.acc p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:15px;font-weight:700;font-size:15px;color:#05060f;background:var(--grad);background-size:200% 100%;box-shadow:0 10px 30px -8px rgba(139,92,255,.8),0 0 0 1px rgba(255,255,255,.12) inset;transition:.3s;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.ghost{background:var(--glass);color:var(--txt);box-shadow:none;border:1px solid var(--line);animation:none}
.btn.full{width:100%}
.acc .btn{grid-column:1/-1}

/* ---------- módulos ---------- */
.mod{margin-top:34px}
.mod-h{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}
.mod-n{display:inline-block;font-size:11px;padding:4px 10px;border-radius:99px;margin-bottom:8px;color:var(--cy);background:rgba(62,242,255,.08);border:1px solid rgba(62,242,255,.3)}
.mod-h h2{font-size:clamp(22px,5.5vw,30px)}
.mod-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.mod-h .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,320px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media (min-width:900px){.rail{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-columns:auto;overflow:visible;margin:0;padding:4px 0}}
.vc{scroll-snap-align:start;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--glass);border:1px solid var(--line);transition:.3s;cursor:pointer;position:relative}
.vc:hover{transform:translateY(-4px);border-color:rgba(62,242,255,.45);box-shadow:0 20px 50px -18px rgba(62,242,255,.45)}
.vc .th{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0b0e1f}
.vc .th img{width:100%;height:100%;object-fit:cover;transition:.4s}
.vc .th .playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px}
.vc .th .playbtn svg{width:20px;height:20px}
.vc .th .badge{position:absolute;left:10px;top:10px}
.vc .bd{padding:12px 14px 14px}
.vc h4{font-size:15.5px;line-height:1.3}
.vc p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.prog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--muted)}
.prog .bar{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--grad)}
/* bloqueado */
.locked .th img{filter:blur(7px) saturate(.6) brightness(.55);transform:scale(1.12)}
.locked .lk{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;text-align:center}
.lockico{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,200,87,.18),rgba(139,92,255,.18));border:1px solid rgba(255,200,87,.55);box-shadow:0 0 26px rgba(255,200,87,.3);position:relative;overflow:hidden}
.lockico::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:brillo 2.8s ease-in-out infinite}
@keyframes brillo{60%,100%{transform:translateX(100%)}}
.lockico svg{width:24px;height:24px;stroke:var(--am)}
.locked .lk span{font-size:10.5px;color:var(--am)}

/* biblioteca */
.libs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lb{position:relative;border-radius:20px;overflow:hidden;background:var(--glass);border:1px solid var(--line);transition:.3s;display:flex;flex-direction:column}
.lb:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 16px 40px -16px var(--c)}
.lb .cv{position:relative;aspect-ratio:4/3;overflow:hidden}
.lb .cv img{width:100%;height:100%;object-fit:cover;object-position:top}
.lb .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(4,5,13,.92))}
.lb.locked .cv img{filter:blur(3px) brightness(.6) saturate(.7)}
.lb .em{position:absolute;right:10px;bottom:8px;z-index:2;font-size:20px}
.lb .lockmini{position:absolute;left:10px;top:10px;z-index:2}
.lb .bd{padding:10px 12px 12px}
.lb h4{font-size:14.5px;line-height:1.25}
.lb small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}

/* herramientas */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tl{position:relative;display:flex;gap:12px;align-items:center;padding:30px 14px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);transition:.3s;overflow:hidden}
.tl:hover{border-color:rgba(62,242,255,.45)}
.tl .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(145deg,rgba(62,242,255,.16),rgba(139,92,255,.16));border:1px solid var(--line)}
.tl b{display:block;font:700 15px/1.25 "Space Grotesk"}
.tl small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.tl .badge{position:absolute;right:10px;top:10px}

/* aportación */
.aport{margin-top:34px;padding:20px;border-radius:26px;text-align:center;background:linear-gradient(160deg,rgba(255,200,87,.1),rgba(139,92,255,.12));border:1px solid rgba(255,200,87,.3)}
.aport .precio{font:700 54px/1 "Space Grotesk";margin:10px 0 2px}
.aport .precio small{font-size:18px;color:var(--muted)}
.aport ul{list-style:none;padding:0;margin:14px auto;max-width:420px;text-align:left}
.aport li{display:flex;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.aport li i{font-style:normal}
.steps{display:grid;gap:8px;margin:14px 0;text-align:left}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(4,5,13,.45);border:1px solid var(--line);font-size:13.5px}
.step b{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;background:var(--grad);color:#05060f}

.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
@media (min-width:700px){.tiers{grid-template-columns:repeat(4,1fr)}}
.tier{position:relative;padding:16px 8px 14px;border-radius:18px;background:rgba(4,5,13,.5);border:1px solid var(--line);text-align:center;transition:.25s}
.tier:hover{border-color:rgba(62,242,255,.4)}
.tier .e{font-size:24px;display:block}
.tier b{display:block;font:700 22px/1.2 "Space Grotesk";margin-top:4px}
.tier small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.tier.on{border-color:var(--cy);background:linear-gradient(160deg,rgba(62,242,255,.14),rgba(139,92,255,.14));box-shadow:0 0 30px -8px var(--cy)}
.tier.on small{color:#bff8ff}
.tier .pop{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--grad);color:#05060f;white-space:nowrap}
.tusel{font-size:14px;margin-top:6px}
.tusel b{font-family:"Space Grotesk"}
/* ---------- modales ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(2,3,9,.72);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
@media (min-width:700px){.ov{align-items:center}}
.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1124,#080a17);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(30px);transition:.3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh)}
@media (min-width:700px){.sheet{border-radius:26px}}
.ov.on .sheet{transform:none}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-h h3{flex:1;font-size:17px}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.vid iframe,.vid #ytp{position:absolute;left:0;width:100%;top:-60px;height:calc(100% + 120px);border:0;pointer-events:none}
.vid .shield{position:absolute;inset:0;z-index:2;cursor:pointer;-webkit-user-select:none;user-select:none}
.vid .pausa{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(4,5,13,.72) center/cover no-repeat;backdrop-filter:blur(10px);transition:opacity .25s}
.vid .pausa.off{opacity:0;pointer-events:none}
.vid .pausa::before{content:"";position:absolute;inset:0;background:rgba(4,5,13,.55)}
.vid .pausa .playbtn{position:relative}
.vid .spin{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.vid .spin i{width:38px;height:38px;border-radius:50%;border:3px solid rgba(62,242,255,.25);border-top-color:var(--cy);animation:gira .8s linear infinite}
.vid:fullscreen{border-radius:0;border:0;aspect-ratio:auto;width:100vw;height:100vh}
.vid:-webkit-full-screen{border-radius:0;border:0;width:100vw;height:100vh}
.vctl{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:14px;background:rgba(4,5,13,.6);border:1px solid var(--line)}
.vctl button{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--glass);border:1px solid var(--line)}
.vctl button svg{width:17px;height:17px;fill:#fff}
.vctl input[type=range]{flex:1;min-width:0;height:22px;accent-color:#3ef2ff}
.vctl .tm{font:600 11.5px "JetBrains Mono";color:var(--muted);white-space:nowrap}
.vid .fsx{position:absolute;right:10px;bottom:10px;z-index:4;display:none}
.vid:fullscreen .fsx,.vid:-webkit-full-screen .fsx{display:grid}
.vmeta{display:flex;gap:10px;align-items:center;margin-top:12px}
.vmeta p{flex:1;margin:0;color:var(--muted);font-size:13.5px}
.field{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;border-radius:16px;background:rgba(4,5,13,.6);border:1px solid var(--line);margin-top:12px}
.field:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px rgba(62,242,255,.15)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:700 18px "JetBrains Mono";letter-spacing:.12em;text-transform:uppercase;padding:10px 0}
.term{margin-top:12px;padding:12px;border-radius:14px;background:#03040a;border:1px solid var(--line);font:500 12.5px/1.6 "JetBrains Mono";color:#7ff6ff;min-height:40px;white-space:pre-wrap}
.term .err{color:#ff7a9c}.term .ok{color:var(--gr)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* lector */
.rd{max-width:760px;margin:0 auto}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--cy)}
.rd h1{font-size:clamp(25px,6vw,36px);margin:4px 0 16px}
.cont{padding:20px;border-radius:24px;background:rgba(10,13,28,.78);border:1px solid var(--line);backdrop-filter:blur(10px)}
.cont h2{font-size:22px;margin:20px 0 10px}
.cont h3{font-size:16.5px;margin:18px 0 8px;color:var(--c,var(--cy));display:flex;align-items:center;gap:8px}
.cont h3::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;box-shadow:0 0 10px currentColor;transform:rotate(45deg);flex:none}
.cont p{margin:0 0 12px;color:#d3d9f2}
.cont ul{margin:0 0 14px;padding:0;list-style:none}
.cont li{position:relative;padding:9px 12px 9px 40px;margin:6px 0;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.cont li::before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:50%;border:2px solid var(--c,var(--cy))}
.cont li.chk{cursor:pointer}.cont li.chk.on{opacity:.55;text-decoration:line-through}.cont li.chk.on::before{background:var(--c,var(--cy))}
.cont li.num::before{display:none}
.cont li .n{position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--c,var(--cy));color:#05060f}
.cont figure{margin:16px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.cont figure img{display:block;width:100%;height:auto}
.lam{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.lam img{display:block;width:100%;height:auto}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--line);min-width:0}
.item .th{width:54px;height:54px;border-radius:12px;flex:none;object-fit:cover;background:#151a33}
.item div{min-width:0;flex:1}
.item b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14.5px;line-height:1.3}
.item small{color:var(--muted);font-size:11.5px}
.gtitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--cy));margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.gtitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.lhead{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:16px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.lhead img{width:96px;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:14px}
.lhead h1{font-size:clamp(22px,5vw,32px);margin:6px 0}

.lockrow{position:relative;border-radius:16px;overflow:hidden}
.lockrow .items{filter:blur(4px);opacity:.5;pointer-events:none;user-select:none}
.lockrow .cta{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:16px}

/* herramientas UI */
.tool{padding:18px;border-radius:24px;background:rgba(10,13,28,.8);border:1px solid var(--line)}
.tool h2{font-size:22px}

.fld output{font:700 17px "JetBrains Mono";color:var(--cy)}
input[type=range]{width:100%;accent-color:#3ef2ff;height:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border-radius:13px;background:var(--glass);border:1px solid var(--line);text-align:left;font-size:13.5px;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:11.5px}
.seg button.on{background:rgba(62,242,255,.12);border-color:var(--cy)}
.out3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.out3 div{padding:14px 6px;border-radius:16px;text-align:center;background:#05070f;border:1px solid var(--line)}
.out3 div:nth-child(2){border-color:var(--cy);box-shadow:0 0 30px -8px var(--cy)}
.out3 b{display:block;font:700 24px/1.1 "Space Grotesk"}
.out3 span{font-size:11px;color:var(--muted)}
.nota{font-size:12px;color:var(--muted);margin-top:12px}
.scan-in{display:flex;gap:8px;align-items:center;padding:4px 4px 4px 14px;border-radius:16px;background:#05070f;border:1px solid var(--line)}
.scan-in input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:16px;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.chips button{padding:7px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.verd{margin-top:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:#05070f;display:flex;gap:14px;align-items:flex-start}
.verd .big{font-size:34px;line-height:1}
.verd b{font:700 18px "Space Grotesk";display:block}
.verd.si{border-color:rgba(61,255,176,.5);box-shadow:0 0 30px -10px var(--gr)}
.verd.mod{border-color:rgba(255,200,87,.5);box-shadow:0 0 30px -10px var(--am)}
.verd.no{border-color:rgba(255,79,120,.6);box-shadow:0 0 30px -10px #ff4f78}
.plan{display:grid;gap:8px;margin-top:14px}
.dia{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#05070f;border:1px solid var(--line)}
.dia b{font:700 13px "JetBrains Mono";color:var(--cy)}
.mix{height:22px;border-radius:8px;overflow:hidden;display:flex;font-size:10.5px;font-weight:700}
.mix i{display:grid;place-items:center;font-style:normal;color:#05060f}
.mix .n{background:var(--gr)}.mix .v{background:#5b6488;color:#fff}

/* barra inferior */
.tab{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px;background:rgba(10,13,28,.82);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--line);box-shadow:var(--sh);max-width:560px;margin:0 auto}
.tab a,.tab button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:16px;font-size:10.5px;color:var(--muted)}
.tab svg{width:21px;height:21px}
.tab .on{color:#fff;background:rgba(62,242,255,.1)}
.tab .on svg{color:var(--cy);filter:drop-shadow(0 0 6px var(--cy))}
.tab .key{color:var(--am)}
.zoom{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);display:none;overflow:auto}
.zoom.on{display:block}
.zoom img{display:block;width:min(1000px,100%);margin:0 auto;padding:60px 0 30px}
.zoom .ib{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px}
.toast{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 60px));z-index:90;transform:translate(-50%,-20px);opacity:0;transition:.3s;padding:12px 18px;border-radius:16px;background:#0d1124;border:1px solid rgba(61,255,176,.5);box-shadow:0 0 40px -10px var(--gr);font-weight:600;font-size:14px;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:entra .45s ease both}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
@media (min-width:860px){
  .hgrid{grid-template-columns:1fr 1.1fr;gap:26px}
  .hero{padding:26px}
}
@media (max-width:420px){.libs{grid-template-columns:1fr 1fr}.chip-acc span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const C = window.CLUB, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st = { get(k, d){ try { const v = localStorage.getItem("cgf_" + k); return v ? JSON.parse(v) : d } catch(e){ return d } },
             set(k, v){ try { localStorage.setItem("cgf_" + k, JSON.stringify(v)) } catch(e){} } };
let VAULT = null;                       // contenido descifrado
let vistos = st.get("vistos", {});
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
const MODS = [
  {id:"inicio", n:"MÓDULO 01", t:"Empieza aquí", d:"La base de todo: por qué la comida de verdad cambia la vida de tu gato."},
  {id:"tom", n:"MÓDULO 02", t:"La historia de Tom", d:"Un rescate real que explica por qué existe este proyecto."},
  {id:"recetas", n:"MÓDULO 03", t:"Recetas en video", d:"Paso a paso, con ingredientes sencillos del súper."},
  {id:"nutricion", n:"MÓDULO 04", t:"Nutrición felina", d:"Lo que tu gato de verdad necesita comer, explicado fácil."},
];
const TOOLS = [
  {id:"escaner", ic:"🔍", t:"Escáner de alimentos", d:"Escribe un alimento y la IA te dice si tu gato puede comerlo.", free:true},
  {id:"porciones", ic:"🧮", t:"Calculadora de porciones", d:"Gramos exactos al día según peso y perfil de tu gato.", free:false},
  {id:"agua", ic:"💧", t:"Monitor de hidratación", d:"Cuánta agua necesita tu gato y cómo lograr que la tome.", free:false},
  {id:"transicion", ic:"📅", t:"Plan de transición 7 días", d:"Pasa de croquetas a comida natural sin malestares.", free:false},
];
const TIERS = [{v:100, e:"🌸", l:"Aportación básica"}, {v:200, e:"💖", l:"Me gustó el material", pop:"LA MÁS ELEGIDA"}, {v:300, e:"✨", l:"Apoyo especial"}, {v:500, e:"👑", l:"Apoyo extraordinario"}];
let aporte = st.get("aporte", 200);
const unlocked = () => !!VAULT;
const vid = k => C.videos.find(v => v.k === k);
const canSee = v => v.free || unlocked();
const totalItems = C.videos.length + C.libros.length + TOOLS.length;
const freeItems = C.videos.filter(v => v.free).length + TOOLS.filter(t => t.free).length + 1; // +1 vista previa guía
const pct = () => unlocked() ? 100 : Math.round(freeItems / totalItems * 100);

function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600) }
function marcaAcceso(){
  const ok = unlocked();
  $("#chipAcc").className = "chip-acc mono" + (ok ? " ok" : "");
  $("#chipAcc").innerHTML = ok ? "✦ <span>Acceso total</span>" : "🔒 <span>Acceso parcial</span>";
  $("#tabKeyT").textContent = ok ? "Activo" : "Mi clave";
}

/* ---------- descifrado (AES-GCM + PBKDF2) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const normaliza = s => s.trim().toUpperCase().replace(/\s+/g, "");
async function abrir(clave){
  const S = window.SECURE, enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(normaliza(clave)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(S.salt), iterations:S.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(S.iv)}, key, b64(S.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- tarjetas ---------- */
function cardVideo(v, i){
  const ok = canSee(v), seen = vistos[v.k];
  return `<div class="vc ${ok ? "" : "locked"} fade" style="animation-delay:${i * 60}ms" data-v="${v.k}">
    <div class="th"><img src="${v.img}" alt="" loading="lazy">
      ${ok ? `<span class="playbtn">${PLAY}</span><span class="badge ${v.free ? "free" : ""}">${v.free ? "● Libre" : "✦ Premium"}</span>`
           : `<div class="lk"><span class="lockico">${LOCK}</span><span class="mono">CLAVE REQUERIDA</span></div><span class="badge lock">🔒 Bloqueado</span>`}
    </div>
    <div class="bd"><h4>${esc(v.t)}</h4><p>${esc(v.d)}</p>
      <div class="prog"><span>Progreso</span><span class="bar"><i style="width:${seen ? 100 : 0}%"></i></span><span>${seen ? "100%" : "0%"}</span></div></div>
  </div>`;
}
function cardLibro(b, i){
  const ok = unlocked();
  const cnt = b.recetas ? `${b.recetas} recetas` : `${b.secoes} secciones`;
  return `<a class="lb ${ok ? "" : "locked"} fade" href="#/libro/${b.id}" style="--c:${b.cor};animation-delay:${i * 50}ms">
    <div class="cv"><img src="${b.capa}" alt="" loading="lazy"><span class="em">${b.emoji}</span>${ok ? "" : `<span class="badge lock lockmini">${b.preview ? "👁 Vista previa" : "🔒"}</span>`}</div>
    <div class="bd"><h4>${esc(b.titulo)}</h4><small>${cnt} · ${b.paginas} pág.</small></div></a>`;
}
function cardTool(t){
  const ok = t.free || unlocked();
  return `<a class="tl fade" href="#/ia/${t.id}"><span class="ic">${t.ic}</span><span><b>${t.t}</b><small>${t.d}</small></span>
    <span class="badge ${ok ? "free" : "lock"}">${ok ? (t.free ? "● Libre" : "✦ Activo") : "🔒"}</span></a>`;
}
function bloqueAport(){
  if (unlocked()) return "";
  return `<section class="aport fade">
    <span class="mod-n mono">ACCESO TOTAL</span>
    <h2>Elige tu aportación y desbloquea todo</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:8px 0 0">Aportación única desde <b style="color:#fff">$100 MXN</b> · acceso de por vida. Sin importar el monto que elijas, recibes exactamente el mismo acceso completo 💛</p>
    <div class="tiers">${TIERS.map(t => `<button class="tier ${t.v === aporte ? "on" : ""}" data-tier="${t.v}">${t.pop ? `<span class="pop mono">${t.pop}</span>` : ""}<span class="e">${t.e}</span><b>$${t.v} MXN</b><small>${t.l}</small></button>`).join("")}</div>
    <div class="tusel">Tu aportación: <b class="gt tuap">$${aporte} MXN</b></div>
    <ul>
      <li><i>🎬</i> Las 16 clases en video: todas las recetas y la nutrición felina completa</li>
      <li><i>📚</i> 7 materiales: más de 120 recetas, sobrecitos y premios caseros</li>
      <li><i>🧠</i> Herramientas IA: porciones, hidratación y plan de transición</li>
      <li><i>💛</i> Parte de tu aportación ayuda a gatitos rescatados</li>
    </ul>
    <div class="steps">
      <div class="step"><b>1</b><span>Haz tu aportación de <b style="all:unset;font-weight:700" class="tuap">$${aporte} MXN</b> por <b style="all:unset;font-weight:700">SPEI u OXXO</b>. La CLABE te llega por WhatsApp.</span></div>
      <div class="step"><b>2</b><span>Envía la foto de tu comprobante por WhatsApp.</span></div>
      <div class="step"><b>3</b><span>Recibes tu <b style="all:unset;font-weight:700">clave de acceso</b> y desbloqueas todo al instante.</span></div>
    </div>
    <button class="btn full" data-key>🔑 Ya tengo mi clave</button>
  </section>`;
}

/* ---------- vistas ---------- */
function setTab(r){ $$("#tab a").forEach(a => a.classList.toggle("on", a.dataset.r === r)) }

function inicio(){
  setTab("inicio");
  const v1 = vid("v1"), p = pct();
  const libres = C.videos.filter(v => v.free).length, bloq = C.videos.length - libres;
  $("#vista").innerHTML = `
  <section class="hero fade"><div class="hgrid">
    <div>
      <div class="ai-row"><div class="orb"><span class="r3"></span><span class="r2"></span><span class="r1"></span><span class="core"></span></div>
        <div><div class="ai-tag mono">MICHI·IA · ASISTENTE DEL CLUB</div><div class="typing" id="typing"></div></div></div>
      <h1>Bienvenida al <span class="gt">Club Gatito Feliz</span></h1>
      <p class="lead">Clases en video, recetas naturales y herramientas inteligentes para que tu michi viva más y mejor. Todo en línea: no ocupa espacio en tu celular.</p>
    </div>
    <div class="feat" data-v="v1"><img src="${v1.img}" alt=""><div class="play"><span class="playbtn">${PLAY}</span></div>
      <div class="lbl"><b>${esc(v1.t)}</b><span class="badge free">● Clase 1</span></div></div>
  </div>
  <div class="acc"><div class="ring" style="--p:${p}"><b>${p}%</b></div>
    <div><h3>${unlocked() ? "✦ Acceso total activo" : "Tu acceso está parcial"}</h3>
    <p>${unlocked() ? "Tienes todas las clases, los 7 materiales y las herramientas IA desbloqueadas. ¡Disfrútalo!" : `Tienes ${libres} clases libres. ${bloq} clases, 7 materiales y 3 herramientas IA se liberan con tu clave.`}</p></div>
    ${unlocked() ? `<a class="btn ghost" href="#/biblioteca">📚 Ir a las recetas</a>` : `<button class="btn" data-key>🔓 Desbloquear todo · desde $100</button>`}
  </div></section>
  ${MODS.map(m => modulo(m)).join("")}
  <section class="mod"><div class="mod-h"><div><span class="mod-n mono">MÓDULO 05</span><h2>Biblioteca premium</h2><p>7 materiales con recetas paso a paso.</p></div><a class="cnt" href="#/biblioteca">Ver todo →</a></div>
    <div class="libs">${C.libros.map(cardLibro).join("")}</div></section>
  <section class="mod"><div class="mod-h"><div><span class="mod-n mono">MÓDULO 06</span><h2>Herramientas IA</h2><p>Cálculos y respuestas al instante para tu gato.</p></div></div>
    <div class="tools">${TOOLS.map(cardTool).join("")}</div></section>
  ${bloqueAport()}`;
  escribir();
}
function modulo(m){
  const vs = C.videos.filter(v => v.mod === m.id);
  return `<section class="mod" id="m-${m.id}"><div class="mod-h"><div><span class="mod-n mono">${m.n}</span><h2>${m.t}</h2><p>${m.d}</p></div><span class="cnt mono">${vs.filter(canSee).length}/${vs.length}</span></div>
    <div class="rail">${vs.map(cardVideo).join("")}</div></section>`;
}
function clases(){
  setTab("clases");
  $("#vista").innerHTML = `<div class="mod-h fade" style="margin-top:6px"><div><span class="mod-n mono">CLASES EN VIDEO</span><h2>Todas tus clases</h2><p>Toca una clase para verla aquí mismo.</p></div></div>
    ${MODS.map(modulo).join("")}${bloqueAport()}`;

  $("#cPlay").innerHTML = IC.pause; $("#cMute").innerHTML = IC.vol; $("#cTime").textContent = "0:00 / 0:00";
  $("#ovVid").classList.add("on");
  await cargarYT();
  if (!$("#ovVid").classList.contains("on") || !$("#ytp")) return;
  YTP = new YT.Player("ytp", { videoId: yt, host: "https://www.youtube-nocookie.com",
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, showinfo: 0, cc_load_policy: 0 },
    events: { onReady: e => { e.target.playVideo(); pintarCtl() },
      onStateChange: e => { pintarCtl(); if (e.data === 0) { vistos[k] = 1; st.set("vistos", vistos); const pz = $("#vBox .pausa"); if (pz) pz.classList.remove("off") } } } });
  tick = setInterval(pintarCtl, 300);
  $("#vDone").onclick = () => { vistos[k] = 1; st.set("vistos", vistos); cerrar(); toast("✓ Clase marcada como vista"); ruta() };
  vistos[k] = vistos[k] || 0.5; st.set("vistos", vistos);
  $("#ovVid").classList.add("on");
}

/* ---------- clave ---------- */
function abrirClave(motivo){
  const ok = unlocked();
  $("#keyBody").innerHTML = ok
    ? `<div class="term mono"><span class="ok">✓ ACCESO TOTAL ACTIVO</span>\nTodo el contenido del club está desbloqueado en este dispositivo.</div><button class="btn full" style="margin-top:12px" data-close>Seguir disfrutando</button>`
    : `${motivo ? `<p style="margin:0 0 8px;color:var(--muted);font-size:13.5px">🔒 <b style="color:#fff">${esc(motivo)}</b> es contenido premium.</p>` : ""}
      <p style="margin:0;color:var(--muted);font-size:14px">Escribe la clave que recibiste por WhatsApp después de tu aportación (desde <b style="color:#fff">$100 MXN</b>).</p>
      <div class="field" id="kf"><span>🔑</span><input id="kIn" placeholder="TU CLAVE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn" id="kGo" style="padding:11px 16px">Liberar</button></div>
      <div class="term mono" id="kT">&gt; esperando clave_</div>
      <p class="nota">¿Aún no tienes tu clave? Haz tu aportación por SPEI u OXXO y envía tu comprobante por WhatsApp: te la mandamos al instante.</p>`;
  $("#ovKey").classList.add("on");
  if (!ok) { setTimeout(() => $("#kIn").focus(), 250); $("#kGo").onclick = probar; $("#kIn").onkeydown = e => { if (e.key === "Enter") probar() } }
}
const espera = ms => new Promise(r => setTimeout(r, ms));
async function probar(){
  const v = $("#kIn").value; if (!v.trim()) return;
  const T = $("#kT"); $("#kGo").disabled = true;
  T.textContent = "> verificando clave…"; await espera(450);
  T.textContent += "\n> desencriptando contenido ███▒▒▒";
  try {
    const data = await abrir(v); await espera(500);
    VAULT = data; st.set("k", normaliza(v));
    T.innerHTML = esc(T.textContent) + `\n<span class="ok">> ✓ acceso concedido · ${C.videos.length} clases · ${C.libros.length} materiales · ${TOOLS.length} herramientas</span>`;
    marcaAcceso(); await espera(900); cerrar(); toast("✦ ¡Acceso total desbloqueado! Bienvenida al club 💛"); ruta();
  } catch (e) {
    await espera(300);
    T.innerHTML = esc(T.textContent) + `\n<span class="err">> ✕ clave incorrecta. Revisa que esté igual a la que te enviamos.</span>`;
    $("#kf").classList.remove("shake"); void $("#kf").offsetWidth; $("#kf").classList.add("shake");
  }
  $("#kGo").disabled = false;
}

/* ---------- typing IA ---------- */
let typT;
function escribir(){
  const el = $("#typing"); if (!el) return; clearTimeout(typT);
  const libres = C.videos.filter(v => v.free).length;
  const frases = unlocked()
    ? ["Hola 👋 Tu acceso total está activo.", "Te recomiendo empezar por el Bloque 1 de la Guía.", "Prueba el plan de transición de 7 días 📅"]
    : ["Hola 👋 Soy Michi, la IA del club.", `Analicé tu acceso: ${libres} clases libres listas.`, "Empieza por la Clase 1, aquí a la derecha 👉", "Con tu clave desbloqueas todo el club 🔓"];
  let f = 0, c = 0, borrando = false;
  const paso = () => { const t = Array.from(frases[f]);
    if (!borrando) { c++; el.innerHTML = esc(t.slice(0, c).join("")) + '<span class="cur"></span>'; if (c >= t.length) { borrando = true; typT = setTimeout(paso, 2200); return } typT = setTimeout(paso, 34) }
    else { c -= 2; if (c <= 0) { c = 0; borrando = false; f = (f + 1) % frases.length } el.innerHTML = esc(t.slice(0, c).join("")) + '<span class="cur"></span>'; typT = setTimeout(paso, 14) } };
  paso();
}

/* ---------- partículas ---------- */
(function(){ const cv = $("#fx"), x = cv.getContext("2d"); if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  let W, H, P = []; const N = innerWidth < 700 ? 28 : 55;
  const rs = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px" };
  rs(); addEventListener("resize", rs);
  for (let i = 0; i < N; i++) P.push({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: Math.random() * 1.6 + .4});
  const L = 130 * devicePixelRatio;
  (function f(){ x.clearRect(0, 0, W, H);
    for (const p of P) { p.x += p.vx * devicePixelRatio; p.y += p.vy * devicePixelRatio; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
      x.fillStyle = "rgba(127,246,255,.7)"; x.beginPath(); x.arc(p.x, p.y, p.r * devicePixelRatio, 0, 7); x.fill() }
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) { const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < L) { x.strokeStyle = `rgba(139,92,255,${(1 - d / L) * .35})`; x.lineWidth = devicePixelRatio * .7; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke() } }
    if (!document.hidden) requestAnimationFrame(f); else setTimeout(() => requestAnimationFrame(f), 500) })();
})();

/* ---------- navegación ---------- */
function zoom(src){ $("#zI").src = src; $("#zoom").classList.add("on") }
function cerrar(){ $$(".ov").forEach(o => o.classList.remove("on")); cerrarPlayer(); $("#vBox").innerHTML = "" }
function ruta(){
  const p = location.hash.replace(/^#\/?/, "").split("/");
  if (p[0] === "clases") clases();
  else if (p[0] === "biblioteca") biblioteca();
  else if (p[0] === "ia") p[1] ? verTool(p[1]) : iaHub();
  else if (p[0] === "libro") p[2] !== undefined && p[2] !== "" ? verSeccion(p[1], +p[2]) : verLibro(p[1]);
  else inicio();
  if (!["libro"].includes(p[0]) && !p[1]) window.scrollTo({top:0});
}
document.addEventListener("click", e => {
  const v = e.target.closest("[data-v]"); if (v) { verVideo(v.dataset.v); return }
  if (e.target.closest("[data-key]")) { abrirClave(); return }
  const t = e.target.closest("[data-tier]");
  if (t) { aporte = +t.dataset.tier; st.set("aporte", aporte); $$(".tier").forEach(x => x.classList.toggle("on", x === t));
    $$(".tuap").forEach(x => x.textContent = "$" + aporte + " MXN"); return }
  if (e.target.closest("[data-close]") || e.target.classList.contains("ov")) cerrar();
});
$("#chipAcc").onclick = () => abrirClave(); $("#tabKey").onclick = () => abrirClave();
$("#zX").onclick = () => $("#zoom").classList.remove("on");
document.addEventListener("keydown", e => { if (e.key === "Escape") { cerrar(); $("#zoom").classList.remove("on") } });
addEventListener("hashchange", ruta);
(async () => { const k = st.get("k", null); if (k) { try { VAULT = await abrir(k) } catch (e) { st.set("k", null) } } marcaAcceso(); ruta() })();
</script>
